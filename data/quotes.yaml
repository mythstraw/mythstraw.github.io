# 首页「每日一句」名句库（layouts/index.html 读取，也可供以后别处复用）
#
# 轮换规则：index = (距 2000-01-01 的天数) mod 条数，前端 JS 用同一套算法，
# 所以每个访客看到的是「自己本地日期的这一条」。
# 想加句子直接往下面列表里追加（顺序就是轮换顺序），数量变了不用改别的地方。
- text: "我们终此一生，就是要摆脱他人的期待，找到真正的自己"
  author: "伍绮诗《无声告白》"
- text: "不是所有人都有勇气在明知前路艰难的情况下继续往前奋跑的"
  author: "《冲·撞》"
- text: "在人生的路途中，如果我们愿意而且有能力做到两点:放眼前途，容忍异己，我们会受益良多。前者让我们不受损失和伤害，后者可以使我们免于争论和口角"
  author: "叔本华"
- text: "我现在渴望的并非快乐，但求自己不要无知。人们总以为自己和这个世界是隔离的，但只需一株伫立在金色尘埃中的橄榄树，或晨曦下几片亮晶晶的沙滩，也许就能让我们察觉到内心的抗拒正在消解"
  author: "阿尔贝·加缪"
- text: "世界就是你自己，这个真理适用于生活中的所有人。当你懂得这个道理后，你就会意识到，你不认识什么太阳、地球，而永远只承认自己的双眼和双手，因为太阳为眼睛所见，地球为双手所感知"
  author: "叔本华"
- text: "无人问津也好，技不如人也罢，你都要试着安静下来，去做自己该做的事，而不是让内心的烦躁、焦虑，毁掉你本就不多的热情和定力"
  author: "《人民日报》"
- text: "好的和坏的我们都收下吧，然后一声不响继续生活，如此我们才能活得干净、自在，几乎接近幸福，如此我们才敢面对那些美好的事物说：我爱着"
  author: "海桑《 这世界如此喧闹》"
- text: "重要的不是过去，而是你现在变成的样子"
  author: "《狮子王》"
- text: "要完全与另一个人发生关联，必须先跟自己发生关联。如果我们不能拥抱我们自身的孤独，就只是利用他人作为对抗孤立的挡箭牌而已。只有当人可以活得像只老鹰，不需要任何观众，才能爱慕地转向另一个人。只有在那个时候，一个人才能够去关心另一个存在的生长。"
  author: "欧文·亚隆《当尼采哭泣》"
- text: "内心过分单纯和敏锐、看问题的目光过于明察秋毫，实际并无好处。处理人间事务时粗线条即可，不必过分深究。世间万事万物，总存在太多彼此矛盾的方面和各不相同的形式，考虑多了，反而迷茫"
  author: "蒙田《蒙田随笔》"
- text: "跟志趣相投的人共事，跟思维同频的人生活，跟互相喜欢的朋友呆在一起，是理想的生活"
  author: "李雪琴"
- text: "有一些人，在出生的地方，他们好像是过客，孩提时代就非常熟悉的浓荫郁郁的小巷，同伙伴们游戏其中的人烟稠密的街衢，对他们来说都不过是旅途中的一个宿站"
  author: "毛姆《月亮与六便士》"
- text: "认识自己的无知，是认识世界最可靠的方法"
  author: "蒙田"
- text: "真正的发现之旅，不在于寻找新的风景，而在于拥有新的眼光"
  author: "普鲁斯特"
- text: "我们读书，是为了知道自己并不孤单。"
  author: "C.S.路易斯"
- text: "每一个不曾起舞的日子，都是对生命的辜负"
  author: "尼采"
- text: "世界上只有一种真正的英雄主义，就是在认清生活真相之后依然热爱生活"
  author: "罗曼·罗兰"
- text: "耐心是一切聪明才智的基础"
  author: "柏拉图"
- text: "人感知的不是英寸、米、磅和加仑，他只感到热，感到冷，感到轻重。他还懂得恨和爰、骄傲和绝望。感受是无法以公式计算的，情绪也没有换算因数"
  author: "罗杰·泽拉兹尼"
- text: "你的时间有限，不要浪费时间过别人的生活"
  author: "史蒂夫·乔布斯"
- text: "去读书，去学习，去受教育，记住掌握知识不是目的而是手段，最重要的是我们可以拥有选择的机会"
  author: "《我的天才女友》"
- text: "一个人之所以有意思，是因为他大量阅读，习惯思考，放缓脚步，投入深度对话，并为自己创建了一个丰满的内心世界"
  author: "威廉 · 德雷谢维奇"
- text: "没有一劳永逸，永远要重新开始，重新进入动荡，重新寻找，重新赢得欢喜"
  author: "是枝裕和《步履不停》"
- text: "我也不想要这么念旧，念旧的人很寂寞，风吹心动，就期待是你回来过。没有人愿意沉湎于回忆，只不过美好的都属于过去。星星发亮是为了让每一个人有一天都能找到属于自己的星星"
  author: "《小王子》"
- text: "在人生或者职业的各种事务中，性格的作用比智力大得多，头脑的作用不如心情，天资不如由判断力所节制着的自制，耐心和规律"
  author: "海明威《真实的高贵》"
- text: "其实所有纠结做选择的人心里早就有了答案，咨询只是想得到内心所倾向的选择。最终的所谓命运，还是自己一步步走出来的"
  author: "东野奎吾《解忧杂货店》"
- text: "一个人的兴趣越广泛，他拥有的快乐机会就越多，而受命运拨弄的可能性也就越小，因为即使失去了某一种兴趣，他仍然可以转向另一种"
  author: "《幸福之路》罗素"
- text: "你能在浪费时间中获得乐趣，就不是浪费时间"
  author: "伯特兰.罗素"
- text: "我期许自己要活得更真实也更诚实，要更接受甚至喜欢自己身上起伏的每部分，才能更喜欢这世界"
  author: "蔡崇达《皮囊》"
- text: "吹毛求疵的人即便在天堂也能挑出瑕疵。一个安心的人在哪都可以过自得其乐的生活"
  author: "《瓦尔登湖》梭罗"
- text: "现在不是去想缺少什么的时候，该想一想凭现有的东西你能做什么"
  author: "海明威《老人与海》"
- text: "过去不是有形的东西，也不必依靠有形的物体来缅怀提醒。过去是造成今日我们本身的必须过程，它存在我们生命中，是遗失不了的"
  author: "三毛《谈心》"
- text: "当暴风雨过去，你不会记得自己是如何度过，你甚至不确定暴风雨是否真正结束，但你不再是当初走进暴风雨里的那个人。这就是暴风雨的意义。"
  author: "村上春树"
- text: "也许每个人心中都有一个风筝，无论它意味着什么，让我们勇敢地去追寻"
  author: "《追风筝的人》卡勒德·胡赛尼"
- text: "年轻时并不知道自己想要过什么样的生活，但一直清楚地知道我不要过什么样的生活。那些能预知的，经过权衡算计的世俗生活对我毫无吸引力，我要的不是成功，而是看到生命的奇迹"
  author: "《像我这样笨拙地生活》廖一梅"
- text: "我心中已经听到来自远方的呼唤，再不需要回过头去关心身后的种种是非与议论"
  author: "米兰·昆德拉"
- text: "人们总是用一生来等待开始新的生活，这是很常见的现象。等待是思维的一个状态，意味着你需要未来，而你不要现在。你不要此时此刻，你把希望寄托于未来。丧失对当下时刻的意识，会大大地降低你的生命质量"
  author: "《当下的力量》埃克哈特·托利"
- text: "在一个崇高的目标支持下，不停地工作，即使慢，也一定会获得成功"
  author: "爱因斯坦"
  