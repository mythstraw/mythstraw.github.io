# 首页「每日一句」名句库（layouts/index.html 读取，也可供以后别处复用）
#
# 轮换规则：index = (距 2000-01-01 的天数) mod 条数，前端 JS 用同一套算法，
# 所以每个访客看到的是「自己本地日期的这一条」。
# 想加句子直接往下面列表里追加（顺序就是轮换顺序），数量变了不用改别的地方。
- text: "千里之行，始于足下。"
  author: "老子"
- text: "学而不思则罔，思而不学则殆。"
  author: "孔子"
- text: "吾生也有涯，而知也无涯。"
  author: "庄子"
- text: "不积跬步，无以至千里。"
  author: "荀子"
- text: "纸上得来终觉浅，绝知此事要躬行。"
  author: "陆游"
- text: "问渠那得清如许？为有源头活水来。"
  author: "朱熹"
- text: "博学之，审问之，慎思之，明辨之，笃行之。"
  author: "《礼记·中庸》"
- text: "温故而知新，可以为师矣。"
  author: "孔子"
- text: "人生如逆旅，我亦是行人。"
  author: "苏轼"
- text: "玉不琢，不成器；人不学，不知道。"
  author: "《礼记·学记》"
- text: "天下事有难易乎？为之，则难者亦易矣。"
  author: "彭端淑《为学》"
- text: "吾日三省吾身。"
  author: "曾子"
- text: "认识自己的无知，是认识世界最可靠的方法。"
  author: "蒙田"
- text: "真正的发现之旅，不在于寻找新的风景，而在于拥有新的眼光。"
  author: "普鲁斯特"
- text: "我们读书，是为了知道自己并不孤单。"
  author: "C.S.路易斯"
- text: "每一个不曾起舞的日子，都是对生命的辜负。"
  author: "尼采"
- text: "世界上只有一种真正的英雄主义，就是在认清生活真相之后依然热爱生活。"
  author: "罗曼·罗兰"
- text: "耐心是一切聪明才智的基础。"
  author: "柏拉图"
- text: "认识你自己。"
  author: "德尔斐神庙箴言"
- text: "你的时间有限，不要浪费时间过别人的生活。"
  author: "史蒂夫·乔布斯"
