{{/*
    明暗切换按钮的行为（由 partials/header.html 在按钮之后、<nav> 之前调用）。
    必须放在按钮之后：脚本一加载就 getElementById 找按钮并绑定点击。
    行为：默认跟随系统（<html> 上不写 data-theme）；点一下按钮就固定为浅色/深色并记住。
    localStorage 的键 `theme-mode`，<head> 里的脚本（custom_head.html）会在首屏把它写回
    <html>，避免刷新时闪白/闪黑。
*/}}
<script>
  (function () {
    var LIGHT = 'light';
    var DARK = 'dark';
    var ICONS = { light: '☀️', dark: '🌙' };
    var LABELS = {
      light: {{ T "theme_mode_light" | jsonify | safeJS }},
      dark: {{ T "theme_mode_dark" | jsonify | safeJS }}
    };
    var FOLLOW = {{ T "theme_follow_system" | jsonify | safeJS }};
    var HINT = {{ T "theme_toggle_hint" | jsonify | safeJS }};

    var mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var icon = document.getElementById('theme-toggle-icon');
    var text = document.getElementById('theme-toggle-text');

    // 用户手动选过 → 返回 'light'/'dark'；没选过 → null（即跟随系统）
    function stored() {
      var v = null;
      try { v = localStorage.getItem('theme-mode'); } catch (e) { }
      return (v === LIGHT || v === DARK) ? v : null;
    }
    function systemMode() { return (mql && mql.matches) ? DARK : LIGHT; }
    function current() { return stored() || systemMode(); }

    function render() {
      var memo = stored();
      var mode = memo || systemMode();
      var next = (mode === LIGHT) ? DARK : LIGHT;
      // 只有手动锁定才写 data-theme，否则交给 prefers-color-scheme
      if (memo) { root.setAttribute('data-theme', mode); } else { root.removeAttribute('data-theme'); }
      root.setAttribute('data-theme-mode', memo || 'auto');
      if (icon) { icon.textContent = ICONS[mode]; }
      if (text) { text.textContent = LABELS[mode]; }
      if (btn) {
        var label = (memo ? '' : FOLLOW + '：') + LABELS[mode] + HINT + LABELS[next];
        btn.title = label;
        btn.setAttribute('aria-label', label);
      }
    }

    if (btn) {
      btn.addEventListener('click', function () {
        var next = (current() === LIGHT) ? DARK : LIGHT;
        try { localStorage.setItem('theme-mode', next); } catch (e) { }
        render();
      });
    }

    // 还没手动锁定时，系统主题变了要同步按钮上的图标与文字
    if (mql) {
      var onChange = function () { if (!stored()) { render(); } };
      if (mql.addEventListener) { mql.addEventListener('change', onChange); }
      else if (mql.addListener) { mql.addListener(onChange); }
    }

    render();
  })();
</script>
