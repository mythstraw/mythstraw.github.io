# 站点基础配置
# Site configuration. Docs: https://gohugo.io/getting-started/configuration/
baseURL: "https://mythstraw.github.io/"
theme: "hugo-bearneo"

# 站点名称（同时用于生成的 HTML 元数据）
title: "ForeverYang's 博客"

# ---- 顶部导航菜单 ----
# ---- 顶部导航菜单 ----
# 首页与博客文章由 layouts/partials/nav.html 自动输出，这里只加额外页面
# （顺序：首页 → 博客文章 → 下面的项，按 weight 升序）。
# name 是显示文案，pageRef 指向 content/ 里的页面。
menus:
  main:
    - name: "工具推荐"
      pageRef: "/projects"
      weight: 10
    - name: "关于我"
      pageRef: "/about"
      weight: 20

# ---- 语言 ----
# 站点只保留中文一种语言：URL 不带语言前缀，原有链接全部不变。
# 界面文案统一放 i18n/zh-cn.toml；语言 key 必须与下面 languages 的键名一致
# （直接删掉整个 languages 段，Hugo 会回落到默认语言 en，界面文案就会变成 key 名）。
# 以后要恢复英文站：加回 languages.en 段 + i18n/en.toml，需要英文版的页面放同名 xxx.en.md。
defaultContentLanguage: "zh-cn"
defaultContentLanguageInSubdir: false
languages:
  zh-cn:
    languageName: "中文"
    languageCode: "zh-cn"
    weight: 1
    params:
      description: "ForeverYang 的个人博客：记录知识管理、AI工具学习、读书与日常折腾。"

# 生成 robots.txt（利于 SEO）
enableRobotsTXT: true

# Bear Blog 风格的干净 URL：不生成 taxonomy 列表页
disableKinds: ["taxonomy"]
ignoreErrors: ["error-disable-taxonomy"]

# 生成的 URL 结构
permalinks:
  blog: "/p/:slug"
  tags: "/blog/:slug"

params:
  # 用于 Hugo 内置 opengraph 模板的 site_name
  title: "ForeverYang's 博客"
  # 站点描述（出现在搜索引擎结果与社交分享）
  description: "ForeverYang 的个人博客：记录知识管理、AI工具学习、读书与日常折腾。"
  # favicon（静态文件相对路径，至少 32x32 的方形 png）
  favicon: "img/favicon.png"
  # favicon 版本号：只用于 URL 缓存清理（layouts/partials/favicon.html）。
  # 换了 static/img/favicon.png 后把这个数字 +1，浏览器才会去取新图标
  faviconVersion: "3"
  # 自定义日期格式（Go layout 语法），默认是 "02 Jan, 2006"
  # 单数月份 / 日（1、2 而非 01、02）→ 2026年9月27日
  dateFormat: "2006年1月2日"
  # 文章列表页在「按年份分组」时用的短格式（年份由分组标题给出，日期只留月日）
  dateFormatShort: "1月2日"
  # 版权文案，用于 RSS 和页脚
  copyright: "Copyright © 2026, ForeverYang"

  # 文章列表按年份分组
  groupByYear: true
  # 文章列表显示文章数量
  showPostCount: true
  # 文章列表页启用搜索框
  postSearch: true
  # 文章页启用目录
  toc: true
  # 文章页启用图片点击放大
  imageZoom: true
  # 外部链接在新标签页打开
  externalLinksNewTab: true

  # 点赞（Bear Blog 风格，需自建 Kudos 后端；未部署保持 false）
  upvote: false

  footer:
    hideCopyright: false
    hideSitemap: false
    # 主题作者请求尽量保留这行致谢；不想显示可改为 true
    hideMadeWithLine: false
    # true 时隐藏页脚的 RSS / 邮件链接
    hideRSSAndEmail: false

  RSS:
    enableRSS: true
    pageLimit: 10

  author:
    name: "ForeverYang"
    # 填上邮箱后，页脚会多出 "say hello" 邮件链接（会公开显示）
    email: "mythstraw@msn.com"

markup:
  # 目录只渲染 h2 ~ h3
  tableOfContents:
    startLevel: 2
    endLevel: 3

  # 代码高亮改成 class 模式（不再写行内 style），配色由
  # assets/css/chroma-light.css 与 chroma-dark.css 提供（hugo gen chromastyles 生成），
  # 这样浅色模式用浅底深字、深色模式用深底浅字，两态各有一套配色。
  highlight:
    noClasses: false

  # 段内单个换行也渲染成 <br>（CommonMark 默认把它折叠成一个空格，
  # 于是 Obsidian 里看着有换行、网页上却连成一行）。开成 true 后
  # 正文怎么写就怎么显示，源文件不用为了排版额外加空行。
  goldmark:
    renderer:
      hardWraps: true
